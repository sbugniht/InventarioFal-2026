<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario · Accesso</title>
  <link rel="stylesheet" href="/static/stile.css">
</head>
<body>
  <div class="barra"><span class="titolo">Inventario</span></div>
  <main>
    <section class="scheda" id="scelta-nome">
      <h2>Chi sei?</h2>
      <div class="nomi" id="nomi"><span class="tenue">Caricamento…</span></div>
      <p class="errore" id="errore-nomi"></p>
      <p id="offline" class="nascosto">
        <button class="btn" id="continua-offline"></button>
      </p>
    </section>

    <section class="scheda nascosto" id="pin">
      <h2 id="pin-titolo"></h2>
      <div id="pin-operatore">
        <div class="pin-punti" id="punti"><span></span><span></span><span></span><span></span></div>
        <div class="tastierino" id="tastierino">
          <button data-cifra="1">1</button><button data-cifra="2">2</button><button data-cifra="3">3</button>
          <button data-cifra="4">4</button><button data-cifra="5">5</button><button data-cifra="6">6</button>
          <button data-cifra="7">7</button><button data-cifra="8">8</button><button data-cifra="9">9</button>
          <button data-azione="indietro">✕</button><button data-cifra="0">0</button><button data-azione="cancella">⌫</button>
        </div>
      </div>
      <form id="pin-admin" class="nascosto">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password">
        <p class="azioni-secondarie" style="margin-top:12px">
          <button type="button" class="btn" id="admin-indietro">Indietro</button>
          <button type="submit" class="btn primario">Entra</button>
        </p>
      </form>
      <p class="errore" id="errore-pin" style="text-align:center"></p>
    </section>
  </main>

<script src="/static/comune.js"></script>
<script>
let scelto = null, pin = "";

async function caricaNomi() {
  try {
    const utenti = await api("/api/utenti-accesso");
    $("#nomi").innerHTML = utenti.map(u =>
      `<button class="btn" data-id="${u.id}" data-ruolo="${u.ruolo}">${esc(u.nome)}</button>`).join("");
  } catch (e) {
    $("#nomi").innerHTML = "";
    $("#errore-nomi").textContent = e.message;
    // Senza rete: chi ha già fatto l'accesso su questo tablet può continuare a registrare a mano
    const io = memoria.leggi("io");
    if (e.stato === 0 && io && io.ruolo !== "admin") {
      $("#offline").classList.remove("nascosto");
      $("#continua-offline").textContent = `Continua senza rete come ${io.nome}`;
    }
  }
}

$("#continua-offline").addEventListener("click", () => { location.href = "/operatore"; });

$("#nomi").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  scelto = { id: Number(b.dataset.id), nome: b.textContent, ruolo: b.dataset.ruolo };
  pin = "";
  aggiornaPunti();
  $("#errore-pin").textContent = "";
  $("#pin-titolo").textContent = scelto.ruolo === "admin" ? `${scelto.nome}: password` : `${scelto.nome}: PIN`;
  $("#pin-operatore").classList.toggle("nascosto", scelto.ruolo === "admin");
  $("#pin-admin").classList.toggle("nascosto", scelto.ruolo !== "admin");
  $("#scelta-nome").classList.add("nascosto");
  $("#pin").classList.remove("nascosto");
  if (scelto.ruolo === "admin") $("#password").focus();
});

function indietro() {
  $("#pin").classList.add("nascosto");
  $("#scelta-nome").classList.remove("nascosto");
  $("#password").value = "";
}
$("#admin-indietro").addEventListener("click", indietro);

function aggiornaPunti() {
  document.querySelectorAll("#punti span").forEach((s, i) => s.classList.toggle("pieno", i < pin.length));
}

$("#tastierino").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.azione === "indietro") return indietro();
  if (b.dataset.azione === "cancella") pin = pin.slice(0, -1);
  else if (pin.length < 4) pin += b.dataset.cifra;
  aggiornaPunti();
  if (pin.length === 4) entra(pin);
});

$("#pin-admin").addEventListener("submit", e => { e.preventDefault(); entra($("#password").value); });

async function entra(segreto) {
  $("#errore-pin").textContent = "";
  try {
    const io = await api("/api/accesso", { json: { utente_id: scelto.id, pin: segreto } });
    memoria.scrivi("io", io);
    location.href = io.ruolo === "admin" ? "/admin" : "/operatore";
  } catch (e) {
    beep("errore");
    $("#errore-pin").textContent = e.message;
    pin = "";
    aggiornaPunti();
  }
}

caricaNomi();
</script>
</body>
</html>
